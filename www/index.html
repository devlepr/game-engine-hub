<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>المحرك — المشاريع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #000000;
    --sidebar: #0D0D0D;
    --panel: #0A0A0A;
    --surface-2: #161616;
    --row-hover: #161616;
    --border: #232323;
    --text: #F2F2F2;
    --text-muted: #8A8A8A;
    --text-dim: #5C5C5C;
    --btn-fill: #F2F2F2;
    --btn-fill-text: #0A0A0A;
    --danger: #C77268;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family:'Tajawal', sans-serif;
    overflow:hidden;
  }
  .mono{ font-family:'JetBrains Mono', monospace; direction:ltr; text-align:right; unicode-bidi:plaintext; }
  button{ font-family:'Tajawal', sans-serif; }

  .app{
    display:flex;
    height:100vh;
    width:100vw;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width: 220px;
    flex-shrink:0;
    background: var(--sidebar);
    border-left: 1px solid var(--border);
    display:flex;
    flex-direction:column;
    transition: width .15s ease;
  }
  .sidebar-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 14px 14px;
  }
  .avatar{
    width:30px; height:30px;
    border-radius:50%;
    background: #3A3A3A;
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700;
    flex-shrink:0;
  }
  .icon-btn{
    width:28px; height:28px;
    border-radius:8px;
    background:transparent;
    border:none;
    color: var(--text-muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:15px;
  }
  .icon-btn:hover{ background: var(--row-hover); color: var(--text); }

  .nav{ flex:1; padding: 4px 8px; overflow-y:auto; }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding: 9px 10px;
    border-radius:8px;
    color: var(--text-muted);
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    margin-bottom:2px;
    white-space:nowrap;
  }
  .nav-item svg{ width:16px; height:16px; flex-shrink:0; }
  .nav-item:hover{ background: var(--row-hover); color: var(--text); }
  .nav-item.active{ background: var(--row-hover); color: var(--text); font-weight:700; }
  .nav-label{ overflow:hidden; text-overflow:ellipsis; }

  .sidebar-bottom{ border-top:1px solid var(--border); padding: 4px 8px; }

  /* ---------- Main ---------- */
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 16px 18px 12px;
    gap:10px;
  }
  .topbar h1{ font-size:20px; margin:0; font-weight:900; white-space:nowrap; }
  .topbar-right{ display:flex; align-items:center; gap:8px; }

  .search{
    display:flex; align-items:center; gap:8px;
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding: 7px 10px;
    color: var(--text-dim);
    font-size:13px;
    width:150px;
  }
  .search svg{ width:14px; height:14px; flex-shrink:0; opacity:.7; }

  .btn{
    border:none; cursor:pointer;
    font-weight:700;
    border-radius:8px;
    transition: transform .1s ease, background .15s ease;
    white-space:nowrap;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-fill{ background: var(--btn-fill); color: var(--btn-fill-text); padding: 8px 16px; font-size:13.5px; }
  .btn-fill:hover{ background:#fff; }
  .btn-outline{
    background:transparent; border:1px solid var(--border); color: var(--text);
    padding: 8px 13px; font-size:13.5px; display:flex; align-items:center; gap:6px;
  }
  .btn-outline:hover{ background: var(--row-hover); }

  .table-wrap{
    flex:1;
    margin: 0 18px 18px;
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .row-head{
    display:grid;
    grid-template-columns: 30px 1fr 130px 110px 60px;
    padding: 10px 16px;
    font-size:11px;
    color: var(--text-dim);
    font-weight:700;
    border-bottom:1px solid var(--border);
  }
  .rows{ overflow-y:auto; flex:1; }
  .row{
    display:grid;
    grid-template-columns: 30px 1fr 130px 110px 60px;
    align-items:center;
    padding: 13px 16px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    font-size:13.5px;
  }
  .row:last-child{ border-bottom:none; }
  .row:hover{ background: var(--row-hover); }
  .star{ color: var(--text-dim); font-size:14px; }
  .proj-name{ font-weight:700; }
  .proj-path{ color: var(--text-muted); font-size:12px; margin-top:2px; }
  .proj-date{ color: var(--text-muted); }
  .proj-version{ color: var(--text-muted); font-size:12.5px; }
  .row-actions{ display:flex; justify-content:flex-end; }
  .row-actions button{
    background:transparent; border:none; color: var(--text-dim);
    font-size:12.5px; cursor:pointer; padding:4px 8px; border-radius:6px;
  }
  .row-actions button:hover{ color: var(--danger); background: var(--row-hover); }

  .empty{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color: var(--text-dim); gap:14px; padding: 20px; text-align:center; }
  .empty-grid{ width:36px; height:36px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:5px; }
  .empty-grid div{ background:#242424; border-radius:3px; }
  .empty-title{ color: var(--text-muted); font-size:14px; font-weight:700; }
  .empty-sub{ font-size:12.5px; color: var(--text-dim); }

  /* ---------- Responsive: phones ---------- */
  @media (max-width: 720px){
    .sidebar{ width:60px; }
    .nav-label{ display:none; }
    .nav-item{ justify-content:center; padding:10px 0; }
    .sidebar-top{ justify-content:center; padding:12px 6px; }
    .sidebar-top .icon-btn{ display:none; }
    .topbar h1{ font-size:17px; }
    .search{ display:none; }
    .btn-outline span.full-label{ display:none; }
    .row-head{ display:none; }
    .row{
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      row-gap:4px;
      padding: 12px 14px;
    }
    .star{ display:none; }
    .proj-date, .proj-version{ font-size:11.5px; grid-column:1; }
    .proj-date::before{ content:"آخر فتح: "; }
    .proj-version::before{ content:"— الإصدار "; }
    .row-actions{ grid-row: 1; grid-column:2; align-items:flex-start; }
  }

  /* ---------- New Project modal ---------- */
  .overlay{
    position:fixed; inset:0;
    background: rgba(0,0,0,0.75);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity .15s ease;
    z-index:10;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }

  .np-modal{
    background: var(--sidebar);
    border:1px solid var(--border);
    border-radius:12px;
    width:900px; max-width:calc(100vw - 32px);
    height:600px; max-height:calc(100vh - 32px);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .np-header{
    text-align:center;
    padding: 14px 16px 12px;
    border-bottom:1px solid var(--border);
    position:relative;
    flex-shrink:0;
  }
  .np-header h3{ margin:0; font-size:15px; }
  .np-header .np-version{ font-size:11.5px; color:var(--text-dim); margin-top:3px; }
  .np-close{
    position:absolute; left:12px; top:10px;
    background:transparent; border:none; color:var(--text-dim);
    font-size:18px; cursor:pointer; width:28px; height:28px; border-radius:8px;
  }
  .np-close:hover{ background: var(--row-hover); color:var(--text); }

  .np-body{
    flex:1;
    display:flex;
    min-height:0;
  }

  .np-categories{
    width:170px; flex-shrink:0;
    border-left:1px solid var(--border);
    padding: 14px 10px;
    overflow-y:auto;
  }
  .np-search{
    display:flex; align-items:center; gap:8px;
    background: var(--panel); border:1px solid var(--border);
    border-radius:8px; padding:8px 10px; margin: 0 10px 12px;
    font-size:12.5px; color:var(--text-dim);
  }
  .np-search svg{ width:13px; height:13px; opacity:.7; flex-shrink:0; }
  .np-cat-item{
    padding: 8px 10px; border-radius:7px; font-size:13px;
    color:var(--text-muted); cursor:pointer; margin-bottom:2px; font-weight:500;
  }
  .np-cat-item:hover{ background: var(--row-hover); color:var(--text); }
  .np-cat-item.active{ background: var(--row-hover); color:var(--text); font-weight:700; }

  .np-list{
    width:260px; flex-shrink:0;
    border-left:1px solid var(--border);
    overflow-y:auto;
    padding: 10px;
  }
  .np-tpl{
    display:flex; align-items:center; gap:10px;
    padding: 9px 10px; border-radius:9px;
    cursor:pointer; margin-bottom:3px;
    border: 1px solid transparent;
  }
  .np-tpl:hover{ background: var(--row-hover); }
  .np-tpl.selected{ background: var(--row-hover); border-color:#3a3a3a; }
  .np-tpl-icon{
    width:30px; height:30px; border-radius:7px; flex-shrink:0;
    background: var(--surface-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--text-muted);
  }
  .np-tpl-icon svg{ width:15px; height:15px; }
  .np-tpl-name{ font-size:13.5px; font-weight:700; }
  .np-tpl-sub{ font-size:11.5px; color:var(--text-dim); margin-top:1px; }

  .np-preview{
    flex:1;
    padding: 18px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
  }
  .np-preview-img{
    width:100%; height:150px; border-radius:10px; flex-shrink:0;
    background: var(--surface-2);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:14px;
  }
  .np-preview-img svg{ width:52px; height:52px; color:#555; }
  .np-preview-title{ font-size:15px; font-weight:900; margin-bottom:6px; }
  .np-preview-desc{ font-size:13px; color:var(--text-muted); line-height:1.6; margin-bottom:18px; }

  .np-settings-label{
    font-size:11px; color:var(--text-dim); font-weight:700; letter-spacing:.3px;
    margin-bottom:10px;
  }
  .np-field{ margin-bottom:12px; }
  .np-field label{ display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px; }
  .np-field input{
    width:100%; background: var(--panel); border:1px solid var(--border);
    color: var(--text); padding: 9px 11px; border-radius:8px;
    font-family:'Tajawal', sans-serif; font-size:13.5px; outline:none;
  }
  .np-field input:focus{ border-color:#555; }
  .np-path-row{ display:flex; gap:8px; }
  .np-path-row input{ flex:1; }
  .np-browse{
    background: var(--panel); border:1px solid var(--border); color:var(--text-muted);
    padding: 0 12px; border-radius:8px; font-size:12px; white-space:nowrap; cursor:pointer;
  }
  .np-browse:hover{ color:var(--text); }
  .np-error{ color: var(--danger); font-size:11.5px; margin-top:6px; }

  .np-footer{
    border-top:1px solid var(--border);
    padding: 12px 16px;
    display:flex; justify-content:flex-end; gap:10px;
    flex-shrink:0;
  }

  /* mobile layout for New Project modal */
  @media (max-width: 720px){
    .overlay{ padding:0; }
    .np-modal{ width:100vw; max-width:100vw; height:100vh; max-height:100vh; border-radius:0; }
    .np-body{ flex-direction:column; overflow-y:auto; }
    .np-categories{
      width:100%; border-left:none; border-bottom:1px solid var(--border);
      padding: 10px; display:flex; align-items:center; gap:6px; overflow-x:auto; overflow-y:hidden;
      white-space:nowrap;
    }
    .np-search{ display:none; }
    .np-cat-item{ flex-shrink:0; margin-bottom:0; }
    .np-list{
      width:100%; border-left:none; border-bottom:1px solid var(--border);
      max-height:220px;
    }
    .np-preview{ flex:none; }
    .np-preview-img{ height:110px; }
  }

  .root-hint{ margin: 0 18px 10px; font-size:11px; color: var(--text-dim); word-break:break-all; }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#1E1E1E; border:1px solid var(--border); color:var(--text);
    padding:10px 18px; border-radius:10px; font-size:13px;
    opacity:0; pointer-events:none; transition:all .2s ease; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .np-field input[readonly]{ color: var(--text-muted); }

  /* ================= Editor View ================= */
  .editor-view{
    position:fixed; inset:0; background: var(--bg); z-index:30;
    display:none;
  }
  .editor-view.open{ display:block; }

  .editor-loading{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; background:#000;
  }
  .ed-logo{
    width:46px; height:46px; border-radius:10px;
    border:3px solid #333; border-top-color:#eee;
    animation: ed-spin 0.9s linear infinite;
  }
  @keyframes ed-spin{ to{ transform: rotate(360deg); } }
  .ed-loading-text{ color: var(--text-dim); font-size:13px; }

  .editor-shell{ height:100%; display:flex; flex-direction:column; }
  .ed-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 14px; border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .ed-back{
    background:transparent; border:1px solid var(--border); color:var(--text);
    padding:7px 12px; border-radius:8px; font-size:13px; cursor:pointer; font-family:'Tajawal',sans-serif;
  }
  .ed-back:hover{ background: var(--row-hover); }
  .ed-title{ font-size:13px; color: var(--text-muted); font-weight:700; }
  .ed-controls{ display:flex; gap:6px; }
  .ed-icon-btn{
    width:28px; height:28px; border-radius:6px; background: var(--panel);
    border:1px solid var(--border); color: var(--text-dim);
    display:flex; align-items:center; justify-content:center; font-size:11px;
  }

  .ed-grid{
    flex:1; min-height:0;
    display:grid;
    grid-template-columns: var(--ed-col1, 200px) 4px var(--ed-col3, 1fr) 4px var(--ed-col5, 220px);
    grid-template-rows: var(--ed-row1, 1fr) 4px var(--ed-row3, 200px);
  }
  .ed-panel{ display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden; background: var(--panel); }
  .ed-hierarchy{ grid-column:1; grid-row:1; border-left:1px solid var(--border); border-bottom:1px solid var(--border); }
  .ed-scene{ grid-column:3; grid-row:1; border-bottom:1px solid var(--border); }
  .ed-inspector{ grid-column:5; grid-row:1; border-right:1px solid var(--border); border-bottom:1px solid var(--border); }
  .ed-project{ grid-column:1 / span 5; grid-row:3; }

  #rzHierScene{ grid-column:2; grid-row:1; }
  #rzSceneInsp{ grid-column:4; grid-row:1; }
  #rzTopBottom{ grid-column:1 / span 5; grid-row:2; }

  .ed-resizer{ background: var(--border); }
  .ed-resizer-v{ cursor: col-resize; }
  .ed-resizer-h{ cursor: row-resize; }
  .ed-resizer:hover, .ed-resizer.dragging{ background:#4a4a4a; }

  .ed-panel-head{
    display:flex; align-items:center; gap:12px;
    padding: 7px 12px; font-size:11.5px; color: var(--text-dim); font-weight:700;
    border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .ed-tab{ cursor:default; padding:2px 0; }
  .ed-tab.active{ color: var(--text); border-bottom:2px solid var(--text-dim); }

  .ed-panel-body{ flex:1; min-height:0; overflow-y:auto; padding:8px; }
  .ed-tree-item{ font-size:12.5px; color: var(--text-muted); padding:4px 6px; border-radius:5px; }
  .ed-tree-item.ed-tree-child{ padding-right:18px; }
  #edSceneRoot{ color: var(--text); font-weight:700; }

  .ed-scene-canvas{
    background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 28px 28px;
    background-color:#0d0d0d;
    padding:0;
  }

  .ed-inspector-body{ font-size:12.5px; color: var(--text-dim); text-align:center; padding-top:30px; }

  .ed-project-body{ display:flex; flex-direction:column; padding:0; }

  /* --- FS toolbar --- */
  .ed-fs-toolbar{
    display:flex; align-items:center; gap:8px;
    padding: 7px 10px; flex-shrink:0; border-bottom:1px solid var(--border);
  }
  .ed-fs-icon-btn{
    background: var(--surface-2); border:1px solid var(--border); color:var(--text-muted);
    width:28px; height:28px; border-radius:7px; font-size:13px; flex-shrink:0; cursor:pointer;
  }
  .ed-fs-icon-btn:hover{ color:var(--text); }
  .ed-breadcrumb{
    display:flex; align-items:center; gap:4px; overflow-x:auto; white-space:nowrap;
    font-size:12px; color: var(--text-muted); flex:1; min-width:0;
  }
  .ed-crumb{ cursor:pointer; padding:2px 3px; border-radius:4px; }
  .ed-crumb:last-child{ color: var(--text); font-weight:700; }
  .ed-crumb:hover{ background: var(--row-hover); }
  .ed-crumb-sep{ color: var(--text-dim); }
  .ed-fs-spacer{ flex:0; }

  /* --- tree + grid layout --- */
  .ed-fs-main{ flex:1; min-height:0; display:flex; position:relative; }
  .ed-fs-tree{
    width:190px; flex-shrink:0; overflow-y:auto; background: var(--panel);
    border-left:1px solid var(--border); padding:8px 4px;
  }
  .ed-fs-tree-backdrop{ display:none; }
  .ed-tree-row{
    display:flex; align-items:center; gap:5px; padding:6px 6px; border-radius:6px;
    font-size:12.5px; color: var(--text-muted); cursor:pointer; white-space:nowrap;
  }
  .ed-tree-row:hover{ background: var(--row-hover); }
  .ed-tree-row.active{ background: var(--row-hover); color: var(--text); font-weight:700; }
  .ed-tree-arrow{ width:12px; flex-shrink:0; display:inline-block; transition: transform .1s ease; color: var(--text-dim); font-size:9px; }
  .ed-tree-arrow.open{ transform: rotate(90deg); }
  .ed-tree-arrow.hidden{ visibility:hidden; }

  .ed-fs-grid{
    flex:1; overflow-y:auto; padding: 10px;
    display:grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap:10px;
    align-content:start;
  }
  .ed-file-item{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:8px 4px; border-radius:8px; cursor:pointer; position:relative;
  }
  .ed-file-item:hover{ background: var(--row-hover); }
  .ed-file-item.cut{ opacity:.45; }
  .ed-file-icon{
    width:38px; height:38px; border-radius:6px;
    background: var(--surface-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--text-muted);
    overflow:hidden;
  }
  .ed-file-icon svg{ width:18px; height:18px; }
  .ed-file-icon img{ width:100%; height:100%; object-fit:cover; }
  .ed-file-name{ font-size:11px; color:var(--text-muted); text-align:center; word-break:break-word; max-width:100%; }
  .ed-file-empty{ grid-column:1/-1; text-align:center; color: var(--text-dim); font-size:12.5px; padding:24px; }

  /* --- bottom sheet (add menu) --- */
  .ed-sheet-overlay{
    position:fixed; inset:0; background: rgba(0,0,0,.6); z-index:40;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition: opacity .15s ease;
  }
  .ed-sheet-overlay.open{ opacity:1; pointer-events:auto; }
  .ed-sheet{
    background: var(--sidebar); border:1px solid var(--border); border-bottom:none;
    border-radius:14px 14px 0 0; width:100%; max-width:420px; padding:10px;
    transform: translateY(12px); transition: transform .15s ease;
  }
  .ed-sheet-overlay.open .ed-sheet{ transform: translateY(0); }
  .ed-sheet-item{
    padding:13px 14px; font-size:14px; color: var(--text); border-radius:9px; cursor:pointer;
    display:flex; align-items:center; gap:10px;
  }
  .ed-sheet-item:hover{ background: var(--row-hover); }
  .ed-sheet-item.danger{ color: var(--danger); }
  .ed-sheet-sep{ height:1px; background: var(--border); margin:6px 4px; }

  /* --- context menu --- */
  .ed-ctx-menu{
    position:fixed; z-index:45; background: var(--sidebar); border:1px solid var(--border);
    border-radius:10px; min-width:170px; padding:6px; display:none;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .ed-ctx-menu.open{ display:block; }
  .ed-ctx-item{ padding:9px 12px; font-size:13px; color: var(--text); border-radius:7px; cursor:pointer; }
  .ed-ctx-item:hover{ background: var(--row-hover); }
  .ed-ctx-item.danger{ color: var(--danger); }
  .ed-ctx-sep{ height:1px; background: var(--border); margin:4px 4px; }

  /* --- preview modal --- */
  .ed-preview-overlay{
    position:fixed; inset:0; background: rgba(0,0,0,.8); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:16px;
    opacity:0; pointer-events:none; transition: opacity .15s ease;
  }
  .ed-preview-overlay.open{ opacity:1; pointer-events:auto; }
  .ed-preview-modal{
    background: var(--sidebar); border:1px solid var(--border); border-radius:14px;
    width:100%; max-width:460px; max-height:calc(100vh - 32px);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .ed-pv-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .ed-pv-title{ font-size:13px; font-weight:700; word-break:break-all; }
  .ed-pv-close{
    background:transparent; border:none; color:var(--text-dim); font-size:20px;
    width:30px; height:30px; border-radius:8px; cursor:pointer; flex-shrink:0;
  }
  .ed-pv-close:hover{ background: var(--row-hover); color: var(--text); }
  .ed-pv-body{ overflow-y:auto; padding:14px; }
  .ed-pv-image-wrap{
    width:100%; height:250px; background:#000; border-radius:8px; overflow:hidden;
    position:relative; touch-action:none; display:flex; align-items:center; justify-content:center;
  }
  .ed-pv-image-wrap img{ user-select:none; -webkit-user-drag:none; will-change:transform; }
  .ed-pv-zoom-controls{ display:flex; gap:8px; justify-content:center; margin-top:10px; }
  .ed-pv-zoom-btn{
    background: var(--panel); border:1px solid var(--border); color: var(--text);
    width:34px; height:34px; border-radius:8px; font-size:15px; cursor:pointer;
  }
  .ed-pv-zoom-btn:hover{ background: var(--row-hover); }
  .ed-pv-info{ margin-top:14px; }
  .ed-pv-row{ display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid var(--border); font-size:12px; }
  .ed-pv-row:last-child{ border-bottom:none; }
  .ed-pv-row .k{ color: var(--text-dim); flex-shrink:0; }
  .ed-pv-row .v{ color: var(--text); font-family:'JetBrains Mono',monospace; direction:ltr; text-align:left; word-break:break-all; }
  .ed-pv-audio-icon{
    width:100%; height:110px; background: var(--panel); border-radius:8px;
    display:flex; align-items:center; justify-content:center; color: var(--text-dim); margin-bottom:12px;
  }
  .ed-pv-audio-icon svg{ width:40px; height:40px; }
  .ed-pv-controls{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .ed-pv-play-btn{
    width:42px; height:42px; border-radius:50%; background: var(--btn-fill); color: var(--btn-fill-text);
    border:none; font-size:15px; cursor:pointer; flex-shrink:0;
  }
  .ed-pv-seek{ flex:1; height:6px; background: var(--panel); border-radius:4px; position:relative; cursor:pointer; }
  .ed-pv-seek-fill{ position:absolute; inset:0; width:0%; background: var(--text-muted); border-radius:4px; }
  .ed-pv-time{ font-size:11px; color: var(--text-dim); font-family:'JetBrains Mono',monospace; display:flex; justify-content:space-between; margin-top:4px; }
  .ed-pv-font-sample{ font-size:24px; line-height:1.5; word-break:break-word; color: var(--text); margin-bottom:6px; }
  .ed-pv-font-sample.small{ font-size:14px; }

  @media (max-width: 720px){
    .ed-fs-tree{
      position:absolute; inset:0 auto 0 0; z-index:12; width:75%; max-width:260px;
      transform: translateX(100%); transition: transform .18s ease; border-left:none; border-right:1px solid var(--border);
      box-shadow: -6px 0 16px rgba(0,0,0,.3);
    }
    .ed-fs-tree.open{ transform: translateX(0); }
    .ed-fs-tree-backdrop{
      display:none; position:absolute; inset:0; background:rgba(0,0,0,.5); z-index:11;
    }
    .ed-fs-tree-backdrop.open{ display:block; }
  }
</style>
</head>

<script>
const tableWrap = document.getElementById('tableWrap');
const overlay = document.getElementById('overlay');
const npList = document.getElementById('npList');
const npPreview = document.getElementById('npPreview');
const npCategories = document.getElementById('npCategories');
const rootHint = document.getElementById('rootHint');
const toastEl = document.getElementById('toast');

/* ================= التخزين ================= */
const ROOT_DIR = 'MyEngine/Projects';
const SUBFOLDERS = ['assets', 'scenes', 'scripts'];
const Cap = window.Capacitor;
const FS = Cap && Cap.Plugins && Cap.Plugins.Filesystem;
const isNative = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform() && FS);

let baseDir = 'DOCUMENTS';
let rootPath = 'Documents/' + ROOT_DIR;

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function sanitizeFolder(name){
  return name.trim().replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '-').replace(/^\.+/, '');
}
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 3200);
}

async function initStorage(){
  if(!isNative){
    rootHint.textContent = 'وضع المعاينة (بدون ملفات حقيقية)';
    return;
  }
  try{ await FS.requestPermissions(); }catch(e){ console.warn('perm', e); }
  let ok = false;
  for(const dir of ['DOCUMENTS', 'DATA']){
    try{
      try{ await FS.mkdir({ path: ROOT_DIR, directory: dir, recursive: true }); }catch(e){}
      await FS.readdir({ path: ROOT_DIR, directory: dir });
      await FS.writeFile({ path: ROOT_DIR + '/.write-test', directory: dir, data: 'ok', encoding: 'utf8' });
      await FS.deleteFile({ path: ROOT_DIR + '/.write-test', directory: dir });
      baseDir = dir; ok = true; break;
    }catch(e){ console.error('storage init failed for', dir, e); }
  }
  if(!ok){
    rootHint.textContent = 'تعذّر الوصول لمكان الحفظ';
    showToast('تعذّر الوصول لمساحة التخزين');
    return;
  }
  try{
    const r = await FS.getUri({ path: ROOT_DIR, directory: baseDir });
    rootPath = decodeURIComponent(r.uri.replace('file://', ''));
  }catch(e){ rootPath = (baseDir === 'DOCUMENTS' ? 'Documents/' : 'App-Data/') + ROOT_DIR; }
  rootHint.textContent = 'مكان الحفظ: ' + rootPath + (baseDir === 'DATA' ? '  (مساحة التطبيق الخاصة)' : '');
}

/* --- نسخة الملفات الحقيقية --- */
const nativeStore = {
  async list(){
    const res = await FS.readdir({ path: ROOT_DIR, directory: baseDir });
    const out = [];
    for(const entry of res.files){
      if(entry.type !== 'directory') continue;
      try{
        const f = await FS.readFile({ path: `${ROOT_DIR}/${entry.name}/project.json`, directory: baseDir, encoding: 'utf8' });
        const data = JSON.parse(f.data);
        data.folder = entry.name;
        data.path = `${rootPath}/${entry.name}`;
        out.push(data);
      }catch(e){ /* مجلد بدون project.json: نتجاهله */ }
    }
    return out;
  },
  async create(name, template){
    const folder = sanitizeFolder(name);
    if(!folder) throw new Error('bad-name');
    const existing = await FS.readdir({ path: ROOT_DIR, directory: baseDir });
    if(existing.files.some(f => f.name === folder)) throw new Error('exists');
    await FS.mkdir({ path: `${ROOT_DIR}/${folder}`, directory: baseDir, recursive: true });
    for(const sub of SUBFOLDERS){
      await FS.mkdir({ path: `${ROOT_DIR}/${folder}/${sub}`, directory: baseDir, recursive: true });
    }
    const now = Date.now();
    const data = { id: 'p_' + now, name, template, engineVersion: '0.1.0', createdAt: now, lastOpened: now };
    await FS.writeFile({ path: `${ROOT_DIR}/${folder}/project.json`, directory: baseDir, data: JSON.stringify(data, null, 2), encoding: 'utf8' });
    return { ...data, folder, path: `${rootPath}/${folder}` };
  },
  async touch(p){
    const { folder, path, ...data } = p;
    data.lastOpened = Date.now();
    await FS.writeFile({ path: `${ROOT_DIR}/${folder}/project.json`, directory: baseDir, data: JSON.stringify(data, null, 2), encoding: 'utf8' });
  },
  async remove(p){
    await FS.rmdir({ path: `${ROOT_DIR}/${p.folder}`, directory: baseDir, recursive: true });
  }
};

/* --- نسخة المعاينة (داخل Claude) --- */
const previewStore = {
  async list(){
    try{
      const r = await window.storage.get('projects-list', false);
      return r ? JSON.parse(r.value) : [];
    }catch(e){ return []; }
  },
  async _save(list){
    try{ await window.storage.set('projects-list', JSON.stringify(list), false); }catch(e){}
  },
  async create(name, template){
    const folder = sanitizeFolder(name);
    if(!folder) throw new Error('bad-name');
    const list = await this.list();
    if(list.some(p => p.folder === folder)) throw new Error('exists');
    const now = Date.now();
    const rec = { id: 'p_' + now, name, template, engineVersion: '0.1.0', createdAt: now, lastOpened: now, folder, path: `${rootPath}/${folder}` };
    list.push(rec); await this._save(list); return rec;
  },
  async touch(p){
    const list = await this.list();
    const r = list.find(x => x.folder === p.folder);
    if(r){ r.lastOpened = Date.now(); await this._save(list); }
  },
  async remove(p){
    const list = (await this.list()).filter(x => x.folder !== p.folder);
    await this._save(list);
  }
};

const store = isNative ? nativeStore : previewStore;
let projects = [];

/* ================= القوالب ================= */
const templates = [
  { id:'empty2d', cat:'core', name:'2D فارغ', sub:'أساسية',
    desc:'مشروع فارغ مُعد للألعاب ثنائية الأبعاد. يبدأ بمشهد نظيف من غير أي عناصر.' },
  { id:'platformer', cat:'sample', name:'منصات (Platformer)', sub:'مثال',
    desc:'مشروع جاهز بشخصية قابلة للتحكم، قفز، ومنصات أساسية — نقطة بداية سريعة للألعاب من نوع المنصات.' },
  { id:'topdown', cat:'sample', name:'من أعلى (Top-Down)', sub:'مثال',
    desc:'مشروع بزاوية علوية مع تحكم بأربع اتجاهات، مناسب لألعاب المغامرات أو الاستكشاف.' },
  { id:'runner', cat:'sample', name:'لعبة جري (Runner)', sub:'مثال',
    desc:'مشروع بحركة تلقائية للأمام مع عوائق وقفز — أساس لألعاب الجري اللا نهائي.' },
];
let selectedTemplate = templates[0];
let activeCat = 'all';

function iconFor(id){
  const icons = {
    empty2d:'<rect x="7" y="7" width="10" height="10" rx="1"/>',
    platformer:'<path d="M4 18h4v-5h4v-3h4v-6h4"/><circle cx="6" cy="8" r="2"/>',
    topdown:'<rect x="5" y="5" width="14" height="14" rx="2"/><path d="M12 5v14M5 12h14"/>',
    runner:'<circle cx="7" cy="7" r="2"/><path d="M4 20l3-6 3 2 3-5 3 9"/>'
  };
  return icons[id] || '<rect x="7" y="7" width="10" height="10"/>';
}

function renderCategories(){
  npCategories.querySelectorAll('.np-cat-item').forEach(el => {
    el.classList.toggle('active', el.dataset.cat === activeCat);
    el.onclick = () => { activeCat = el.dataset.cat; renderCategories(); renderList(); };
  });
}

function renderList(){
  const filtered = activeCat === 'all' ? templates : templates.filter(t => t.cat === activeCat);
  npList.innerHTML = filtered.map(t => `
    <div class="np-tpl ${t.id === selectedTemplate.id ? 'selected':''}" data-id="${t.id}">
      <div class="np-tpl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconFor(t.id)}</svg></div>
      <div>
        <div class="np-tpl-name">${t.name}</div>
        <div class="np-tpl-sub">${t.sub}</div>
      </div>
    </div>
  `).join('');
  npList.querySelectorAll('.np-tpl').forEach(el => {
    el.onclick = () => {
      selectedTemplate = templates.find(t => t.id === el.dataset.id);
      renderList(); renderPreview();
    };
  });
}

function renderPreview(){
  npPreview.innerHTML = `
    <div class="np-preview-img">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">${iconFor(selectedTemplate.id)}</svg>
    </div>
    <div class="np-preview-title">${selectedTemplate.name}</div>
    <div class="np-preview-desc">${selectedTemplate.desc}</div>
    <div class="np-settings-label">إعدادات المشروع</div>
    <div class="np-field">
      <label>اسم المشروع</label>
      <input type="text" id="npNameInput" value="مشروعي" placeholder="اسم المشروع">
    </div>
    <div class="np-field">
      <label>مكان الحفظ</label>
      <input type="text" id="npPathInput" class="mono" readonly>
      <div class="np-error" id="npPathError" style="display:none;"></div>
    </div>
  `;
  const nameInput = document.getElementById('npNameInput');
  const pathInput = document.getElementById('npPathInput');
  const update = () => { pathInput.value = `${rootPath}/${sanitizeFolder(nameInput.value) || '...'}`; };
  nameInput.addEventListener('input', update);
  update();
}

/* ================= قائمة المشاريع ================= */
function formatDate(ts){
  const d = new Date(ts);
  const now = new Date();
  if(d.toDateString() === now.toDateString()) return 'اليوم';
  const y = new Date(now); y.setDate(now.getDate()-1);
  if(d.toDateString() === y.toDateString()) return 'أمس';
  return d.toLocaleDateString('ar-EG', { day:'numeric', month:'short' });
}

function renderProjects(){
  if(projects.length === 0){
    tableWrap.innerHTML = `
      <div class="empty">
        <div class="empty-grid"><div></div><div></div><div></div><div></div></div>
        <div class="empty-title">لا توجد مشاريع بعد</div>
        <div class="empty-sub">لإنشاء مشروع جديد اضغط على الزر أعلاه</div>
      </div>`;
    return;
  }
  const sorted = [...projects].sort((a,b) => b.lastOpened - a.lastOpened);
  tableWrap.innerHTML = `
    <div class="row-head">
      <div>★</div><div>الاسم</div><div>آخر تعديل</div><div>إصدار المحرك</div><div></div>
    </div>
    <div class="rows">
      ${sorted.map(p => `
        <div class="row" data-folder="${esc(p.folder)}">
          <div class="star">☆</div>
          <div><div class="proj-name">${esc(p.name)}</div><div class="proj-path mono">${esc(p.path)}</div></div>
          <div class="proj-date">${formatDate(p.lastOpened)}</div>
          <div class="proj-version">${esc(p.engineVersion || '0.1.0')}</div>
          <div class="row-actions"><button data-remove="${esc(p.folder)}">حذف</button></div>
        </div>
      `).join('')}
    </div>
  `;
  tableWrap.querySelectorAll('.row').forEach(row => {
    row.addEventListener('click', async (e) => {
      if(e.target.dataset.remove) return;
      const p = projects.find(x => x.folder === row.dataset.folder);

  Packages: {},
  Scripts: {}
};

function extOf(name){ const m = name.match(/\.([a-zA-Z0-9]+)$/); return m ? m[1].toLowerCase() : ''; }
function kindOf(name){
  const ext = extOf(name);
  if(['png','jpg','jpeg','gif','webp','bmp'].includes(ext)) return 'image';
  if(['ogg','wav','mp3','m4a'].includes(ext)) return 'audio';
  if(['ttf','otf','woff','woff2'].includes(ext)) return 'font';
  if(['js','gd','cs','py','ts'].includes(ext)) return 'script';
  if(['scene'].includes(ext)) return 'scene';
  if(['zip','rar','7z'].includes(ext)) return 'archive';
  if(['txt','md','json'].includes(ext)) return 'text';
  return 'unknown';
}
function isTextKind(kind){ return ['script','scene','text'].includes(kind); }
function mimeFor(name){
  const ext = extOf(name);
  return { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', webp:'image/webp', bmp:'image/bmp' }[ext] || 'application/octet-stream';
}
function iconSvgFor(kind){
  const map = {
    folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>',
    audio:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    font:'<text x="3" y="18" font-size="15" fill="currentColor" stroke="none" font-family="sans-serif">Aa</text>',
    script:'<path d="M8 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M9.5 13l-2 2 2 2M14.5 13l2 2-2 2"/>',
    scene:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
    text:'<path d="M8 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/>',
    archive:'<path d="M21 8H3v13h18z"/><path d="M3 8l2-5h14l2 5"/><path d="M10 12h4"/>',
    unknown:'<path d="M6 3h9l3 3v15H6z"/><path d="M15 3v3h3"/>'
  };
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${map[kind]||map.unknown}</svg>`;
}

/* --- عمليات نظام الملفات: نسخة حقيقية (Capacitor Filesystem) --- */
const nativeFS = {
  _rel(pathArr, name){ return name ? [...pathArr, name].join('/') : pathArr.join('/'); },
  _full(project, rel){ return rel ? `${ROOT_DIR}/${project.folder}/${rel}` : `${ROOT_DIR}/${project.folder}`; },
  async list(project, pathArr){
    const path = this._full(project, this._rel(pathArr));
    try{
      const res = await FS.readdir({ path, directory: baseDir });
      const folders=[], filesOut=[];
      for(const f of res.files){
        if(f.name === 'project.json') continue;
        if(f.type === 'directory') folders.push({ name:f.name });
        else filesOut.push({ name:f.name, size:f.size||0, mtime:f.mtime||0 });
      }
      folders.sort((a,b)=>a.name.localeCompare(b.name));
      filesOut.sort((a,b)=>a.name.localeCompare(b.name));
      return { folders, files: filesOut };
    }catch(e){ return { folders:[], files:[] }; }
  },
  async mkdir(project, pathArr, name){
    await FS.mkdir({ path: this._full(project, this._rel(pathArr, name)), directory: baseDir, recursive: true });
  },
  async ensureDir(project, pathArr){
    if(!pathArr.length) return;
    try{ await FS.mkdir({ path: this._full(project, this._rel(pathArr)), directory: baseDir, recursive: true }); }catch(e){}
  },
  async writeFile(project, pathArr, name, data, encoding){
    const opts = { path: this._full(project, this._rel(pathArr, name)), directory: baseDir, data };
    if(encoding) opts.encoding = encoding;
    await FS.writeFile(opts);
  },
  async readFile(project, pathArr, name, encoding){
    const opts = { path: this._full(project, this._rel(pathArr, name)), directory: baseDir };
    if(encoding) opts.encoding = encoding;
    const r = await FS.readFile(opts);
    return r.data;
  },
  async rename(project, pathArr, oldName, newName){
    const rel = this._rel(pathArr);
    await FS.rename({
      from: this._full(project, rel ? rel+'/'+oldName : oldName),
      to: this._full(project, rel ? rel+'/'+newName : newName),
      directory: baseDir, toDirectory: baseDir
    });
  },
  async copy(project, srcPathArr, name, destPathArr){
    await FS.copy({
      from: this._full(project, this._rel(srcPathArr, name)),
      to: this._full(project, this._rel(destPathArr, name)),
      directory: baseDir, toDirectory: baseDir
    });
  },
  async move(project, srcPathArr, name, destPathArr){
    await FS.rename({
      from: this._full(project, this._rel(srcPathArr, name)),
      to: this._full(project, this._rel(destPathArr, name)),
      directory: baseDir, toDirectory: baseDir
    });
  },
  async remove(project, pathArr, name, isDir){
    const path = this._full(project, this._rel(pathArr, name));
    if(isDir) await FS.rmdir({ path, directory: baseDir, recursive: true });
    else await FS.deleteFile({ path, directory: baseDir });
  }
};

/* --- عمليات نظام الملفات: نسخة المعاينة (شجرة افتراضية) --- */
function seedVfs(skeleton){
  const children = {};
  for(const [name, sub] of Object.entries(skeleton)){
    children[name] = { type:'dir', children: seedVfs(sub) };
  }
  return children;
}
const previewFS = {
  async _root(project){
    try{
      const r = await window.storage.get(`vfs-${project.id}`, false);
      if(r) return JSON.parse(r.value);
    }catch(e){}
    return { type:'dir', children: seedVfs(DEFAULT_TREE_SKELETON) };
  },
  async _save(project, root){ try{ await window.storage.set(`vfs-${project.id}`, JSON.stringify(root), false); }catch(e){} },
  _nav(root, pathArr){
    let node = root;
    for(const p of pathArr){
      if(!node || node.type !== 'dir' || !node.children[p]) return null;
      node = node.children[p];
    }
    return node;
  },
  async list(project, pathArr){
    const root = await this._root(project);
    const node = this._nav(root, pathArr);
    if(!node || !node.children) return { folders:[], files:[] };
    const folders=[], filesOut=[];
    for(const [name, child] of Object.entries(node.children)){
      if(child.type === 'dir') folders.push({ name });
      else filesOut.push({ name, size: child.size||0, mtime: child.mtime||Date.now() });
    }
    folders.sort((a,b)=>a.name.localeCompare(b.name));
    filesOut.sort((a,b)=>a.name.localeCompare(b.name));
    return { folders, files: filesOut };
  },
  async mkdir(project, pathArr, name){
    const root = await this._root(project);
    const node = this._nav(root, pathArr);
    if(node && !node.children[name]) node.children[name] = { type:'dir', children:{} };
    await this._save(project, root);
  },
  async ensureDir(project, pathArr){
    const root = await this._root(project);
    let node = root;
    for(const p of pathArr){
      if(!node.children[p]) node.children[p] = { type:'dir', children:{} };
      node = node.children[p];
    }
    await this._save(project, root);
  },
  async writeFile(project, pathArr, name, data){
    const root = await this._root(project);
    const node = this._nav(root, pathArr);
    if(node) node.children[name] = { type:'file', content:data, size:(data||'').length, mtime:Date.now() };
    await this._save(project, root);
  },
  async readFile(project, pathArr, name){
    const root = await this._root(project);
    const node = this._nav(root, pathArr);
    return (node && node.children[name]) ? node.children[name].content : '';
  },
  async rename(project, pathArr, oldName, newName){
    const root = await this._root(project);
    const node = this._nav(root, pathArr);
    if(node && node.children[oldName]){ node.children[newName] = node.children[oldName]; delete node.children[oldName]; }
    await this._save(project, root);
  },
  async copy(project, srcPathArr, name, destPathArr){
    const root = await this._root(project);
    const src = this._nav(root, srcPathArr), dest = this._nav(root, destPathArr);
    if(src && dest && src.children[name]) dest.children[name] = JSON.parse(JSON.stringify(src.children[name]));
    await this._save(project, root);
  },
  async move(project, srcPathArr, name, destPathArr){
    const root = await this._root(project);
    const src = this._nav(root, srcPathArr), dest = this._nav(root, destPathArr);
    if(src && dest && src.children[name]){ dest.children[name] = src.children[name]; delete src.children[name]; }
    await this._save(project, root);
  },
  async remove(project, pathArr, name){
    const root = await this._root(project);
    const node = this._nav(root, pathArr);
    if(node) delete node.children[name];
    await this._save(project, root);
  }
};

const fsOps = isNative ? nativeFS : previewFS;

/* --- شجرة المشروع --- */
async function buildFolderTree(project, pathArr, depth){
  if(depth > 8) return [];
  const { folders } = await fsOps.list(project, pathArr);
  const out = [];
  for(const f of folders){
    const childPath = [...pathArr, f.name];
    out.push({ name: f.name, path: childPath, children: await buildFolderTree(project, childPath, depth+1) });
  }
  return out;
}

let treeData = [];
let expandedPaths = new Set();

function pathKey(p){ return p.join('/'); }

function renderTreeNodes(nodes, depth){
  return nodes.map(n => {
    const key = pathKey(n.path);
    const isOpen = expandedPaths.has(key);
    const isActive = pathKey(currentPath) === key;
    const hasChildren = n.children.length > 0;
    return `
      <div>
        <div class="ed-tree-row ${isActive ? 'active':''}" data-path="${esc(key)}" style="padding-right:${8 + depth*14}px">
          <span class="ed-tree-arrow ${hasChildren ? (isOpen?'open':''):'hidden'}" data-arrow="${esc(key)}">▶</span>
          <span>${esc(n.name)}</span>
        </div>
        ${isOpen && hasChildren ? `<div>${renderTreeNodes(n.children, depth+1)}</div>` : ''}
      </div>
    `;
  }).join('');
}

function renderTree(){
  edTree.innerHTML = renderTreeNodes(treeData, 0);
  edTree.querySelectorAll('[data-arrow]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = el.dataset.arrow;
      if(expandedPaths.has(key)) expandedPaths.delete(key); else expandedPaths.add(key);
      renderTree();
    });
  });
  edTree.querySelectorAll('.ed-tree-row').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.dataset.path;
      currentPath = key ? key.split('/') : [];
      expandedPaths.add(key);
      renderTree();
      renderBreadcrumb();
      renderGrid();
      closeTreeDrawer();
    });
  });
}

/* --- الضغط المطول --- */
function attachLongPress(el, cb){
  let timer = null, startX = 0, startY = 0, longPressed = false;
  const clear = () => { if(timer){ clearTimeout(timer); timer = null; } };
  el.addEventListener('touchstart', (e) => {
    longPressed = false;
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    timer = setTimeout(() => { longPressed = true; cb(startX, startY); }, 480);
  }, { passive:true });
  el.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if(Math.abs(t.clientX-startX) > 10 || Math.abs(t.clientY-startY) > 10) clear();
  }, { passive:true });
  el.addEventListener('touchend', () => { clear(); });
  el.addEventListener('click', (e) => { if(longPressed){ e.stopPropagation(); longPressed = false; } });
}

let ctxTarget = null;
function openContextMenu(x, y, name, isDir){
  ctxTarget = { name, isDir };
  const items = [
    { key:'rename', label:'إعادة تسمية' },
    { key:'copy', label:'نسخ' },
    { key:'cut', label:'قص' },
    { key:'sep' },
    { key:'info', label:'معلومات' },
    { key:'sep' },
    { key:'delete', label:'حذف', danger:true },
  ];
  edCtxMenu.innerHTML = items.map(it => it.key==='sep'
    ? '<div class="ed-ctx-sep"></div>'
    : `<div class="ed-ctx-item ${it.danger?'danger':''}" data-act="${it.key}">${it.label}</div>`
  ).join('');
  edCtxMenu.classList.add('open');
  const menuW = 190, menuH = 210;
  const left = Math.min(x, window.innerWidth - menuW - 10);
  const top = Math.min(y, window.innerHeight - menuH - 10);
  edCtxMenu.style.left = Math.max(8,left) + 'px';
  edCtxMenu.style.top = Math.max(8,top) + 'px';
  edCtxMenu.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', () => { closeContextMenu(); handleCtxAction(el.dataset.act); });
  });
}
function closeContextMenu(){ edCtxMenu.classList.remove('open'); }
document.addEventListener('click', (e) => { if(!edCtxMenu.contains(e.target)) closeContextMenu(); });

async function handleCtxAction(act){
  if(!ctxTarget || !currentProject) return;
  const { name, isDir } = ctxTarget;
  try{
    if(act === 'rename'){
      const nn = prompt('الاسم الجديد:', name);
      if(!nn || nn.trim() === '' || nn === name) return;
      await fsOps.rename(currentProject, currentPath, name, nn.trim());
      showToast('تم إعادة التسمية');
    }else if(act === 'copy'){
      clipboard = { path:[...currentPath], name, isDir, mode:'copy' };
      showToast('تم النسخ إلى الحافظة');
    }else if(act === 'cut'){
      clipboard = { path:[...currentPath], name, isDir, mode:'cut' };
      showToast('تم القص، الصقه في المكان المطلوب');
    }else if(act === 'info'){
      alert(`الاسم: ${name}\nالنوع: ${isDir ? 'مجلد' : kindOf(name)}`);
      return;
    }else if(act === 'delete'){
      if(!confirm(`حذف "${name}" نهائيًا؟`)) return;
      await fsOps.remove(currentProject, currentPath, name, isDir);
      showToast('تم الحذف');
      if(isDir) await refreshTree();
    }
    await renderGrid();
  }catch(e){ console.error(e); showToast('تعذّر تنفيذ العملية'); }
}

function updatePasteBtn(){
  edPasteBtn.style.display = clipboard ? '' : 'none';
}
edPasteBtn.addEventListener('click', async () => {
  if(!clipboard) return;
  try{
    if(clipboard.mode === 'copy') await fsOps.copy(currentProject, clipboard.path, clipboard.name, currentPath);
    else{ await fsOps.move(currentProject, clipboard.path, clipboard.name, currentPath); }
    showToast(clipboard.mode === 'copy' ? 'تم اللصق (نسخ)' : 'تم النقل');
    if(clipboard.mode === 'cut') clipboard = null;
    await refreshTree();
    await renderGrid();
  }catch(e){ console.error(e); showToast('تعذّر اللصق'); }
});

    if(!name || !name.trim()) return;
    try{ await fsOps.mkdir(currentProject, currentPath, name.trim()); await refreshTree(); await renderGrid(); showToast('تم إنشاء المجلد'); }
    catch(e){ showToast('تعذّر إنشاء المجلد'); }
    return;
  }
  const presets = {
    script: { ext:'.js', content:'// سكريبت جديد\n' },
    scene:  { ext:'.scene', content:'{}' },
    text:   { ext:'.txt', content:'' },
  };
  const p = presets[act];
  if(!p) return;
  let name = prompt('اسم الملف:', 'جديد' + p.ext);
  if(!name || !name.trim()) return;
  name = name.trim();
  if(!name.includes('.')) name += p.ext;
  try{
    await fsOps.writeFile(currentProject, currentPath, name, p.content, 'utf8');
    await renderGrid();
    showToast('تم إنشاء الملف');
  }catch(e){ showToast('تعذّر إنشاء الملف'); }
}

/* --- المعاينة (صور / صوت / خطوط) --- */
const edPreviewOverlay = document.getElementById('edPreviewOverlay');
const edPreviewModal = document.getElementById('edPreviewModal');
let activeFontStyleEl = null;

function resPathFor(name){ return 'res://' + [...currentPath, name].join('/'); }
function humanSize(bytes){
  if(!bytes) return '0 KB';
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}
function typeLabelFor(name, kind){
  const ext = extOf(name).toUpperCase();
  if(kind === 'image') return ext + ' Image';
  if(kind === 'audio') return ext + ' Audio';
  if(kind === 'font') return { TTF:'TrueType Font', OTF:'OpenType Font', WOFF:'Web Font', WOFF2:'Web Font' }[ext] || (ext + ' Font');
  return ext;
}
function fmtTime(s){
  if(!isFinite(s) || s < 0) return '00:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function closePreview(){
  edPreviewOverlay.classList.remove('open');
  const audioEl = edPreviewModal.querySelector('audio');
  if(audioEl) audioEl.pause();
  if(activeFontStyleEl){ activeFontStyleEl.remove(); activeFontStyleEl = null; }
  edPreviewModal.innerHTML = '';
}
edPreviewOverlay.addEventListener('click', (e) => { if(e.target === edPreviewOverlay) closePreview(); });

async function openPreview(name, kind){
  const meta = currentGridFiles.find(f => f.name === name) || {};
  try{
    if(kind === 'image') await openImagePreview(name, meta);
    else if(kind === 'audio') await openAudioPreview(name, meta);
    else if(kind === 'font') await openFontPreview(name, meta);
    else{ showToast(name); return; }
    edPreviewOverlay.classList.add('open');
  }catch(e){ console.error(e); showToast('تعذّرت معاينة الملف'); }
}

async function openImagePreview(name, meta){
  const b64 = await fsOps.readFile(currentProject, currentPath, name);
  const src = `data:${mimeFor(name)};base64,${b64}`;
  edPreviewModal.innerHTML = `
    <div class="ed-pv-head">
      <div class="ed-pv-title">${esc(name)}</div>
      <button class="ed-pv-close" id="edPvClose">×</button>
    </div>
    <div class="ed-pv-body">
      <div class="ed-pv-image-wrap" id="edPvImgWrap"><img id="edPvImg" src="${src}"></div>
      <div class="ed-pv-zoom-controls">
        <button class="ed-pv-zoom-btn" id="edZoomOut">−</button>
        <button class="ed-pv-zoom-btn" id="edZoomReset">⤾</button>
        <button class="ed-pv-zoom-btn" id="edZoomIn">+</button>
      </div>
      <div class="ed-pv-info" id="edPvInfo"></div>
    </div>
  `;
  document.getElementById('edPvClose').addEventListener('click', closePreview);
  const img = document.getElementById('edPvImg');
  const wrap = document.getElementById('edPvImgWrap');
  let scale = 1, baseW = 0, baseH = 0, tx = 0, ty = 0;
  function applyT(){ img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }
  img.onload = () => {
    document.getElementById('edPvInfo').innerHTML = `
      <div class="ed-pv-row"><span class="k">النوع</span><span class="v">${typeLabelFor(name,'image')}</span></div>
      <div class="ed-pv-row"><span class="k">الأبعاد</span><span class="v">${img.naturalWidth} × ${img.naturalHeight}</span></div>
      <div class="ed-pv-row"><span class="k">الحجم</span><span class="v">${humanSize(meta.size)}</span></div>
      <div class="ed-pv-row"><span class="k">المسار</span><span class="v">${esc(resPathFor(name))}</span></div>
    `;
    const wr = wrap.getBoundingClientRect();
    const s = Math.min(wr.width/img.naturalWidth, wr.height/img.naturalHeight, 1);
    baseW = img.naturalWidth*s; baseH = img.naturalHeight*s;
    img.style.width = baseW+'px'; img.style.height = baseH+'px';
    applyT();
  };
  document.getElementById('edZoomIn').addEventListener('click', () => { scale = Math.min(4, scale+0.25); applyT(); });
  document.getElementById('edZoomOut').addEventListener('click', () => { scale = Math.max(0.5, scale-0.25); applyT(); });
  document.getElementById('edZoomReset').addEventListener('click', () => { scale=1; tx=0; ty=0; applyT(); });

  let dragging=false, lastX=0, lastY=0, pinchDist=0;
  wrap.addEventListener('touchstart', (e) => {
    if(e.touches.length===2){ pinchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); }
    else if(e.touches.length===1){ dragging=true; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; }
  }, { passive:true });
  wrap.addEventListener('touchmove', (e) => {
    if(e.touches.length===2){
      e.preventDefault();
      const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      if(pinchDist>0) scale = Math.min(4, Math.max(0.5, scale*(d/pinchDist)));
      pinchDist = d; applyT();
    }else if(e.touches.length===1 && dragging){
      const t = e.touches[0];
      tx += t.clientX-lastX; ty += t.clientY-lastY;
      lastX = t.clientX; lastY = t.clientY; applyT();
    }
  }, { passive:false });
  wrap.addEventListener('touchend', () => { dragging=false; pinchDist=0; });
  wrap.addEventListener('mousedown', (e) => { dragging=true; lastX=e.clientX; lastY=e.clientY; });
  window.addEventListener('mousemove', (e) => { if(dragging){ tx+=e.clientX-lastX; ty+=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY; applyT(); } });
  window.addEventListener('mouseup', () => { dragging=false; });
  wrap.addEventListener('wheel', (e) => { e.preventDefault(); scale = Math.min(4, Math.max(0.5, scale + (e.deltaY<0?0.1:-0.1))); applyT(); }, { passive:false });
}

async function openAudioPreview(name, meta){
  const b64 = await fsOps.readFile(currentProject, currentPath, name);
  const audioMime = { ogg:'audio/ogg', wav:'audio/wav', mp3:'audio/mpeg', m4a:'audio/mp4' }[extOf(name)] || 'audio/mpeg';
  const src = `data:${audioMime};base64,${b64}`;
  edPreviewModal.innerHTML = `
    <div class="ed-pv-head">
      <div class="ed-pv-title">${esc(name)}</div>
      <button class="ed-pv-close" id="edPvClose">×</button>
    </div>
    <div class="ed-pv-body">
      <div class="ed-pv-audio-icon">${iconSvgFor('audio')}</div>
      <div class="ed-pv-controls">
        <button class="ed-pv-play-btn" id="edAudioPlay">▶</button>
        <div style="flex:1;">
          <div class="ed-pv-seek" id="edAudioSeek"><div class="ed-pv-seek-fill" id="edAudioFill"></div></div>
          <div class="ed-pv-time"><span id="edAudioCur">00:00</span><span id="edAudioDur">00:00</span></div>
        </div>
      </div>
      <div class="ed-pv-info">
        <div class="ed-pv-row"><span class="k">النوع</span><span class="v">${typeLabelFor(name,'audio')}</span></div>
        <div class="ed-pv-row"><span class="k">الحجم</span><span class="v">${humanSize(meta.size)}</span></div>
        <div class="ed-pv-row"><span class="k">المسار</span><span class="v">${esc(resPathFor(name))}</span></div>
      </div>
      <audio id="edAudioEl" src="${src}" preload="metadata"></audio>
    </div>
  `;
  document.getElementById('edPvClose').addEventListener('click', closePreview);
  const audio = document.getElementById('edAudioEl');
  const playBtn = document.getElementById('edAudioPlay');
  const fill = document.getElementById('edAudioFill');
  const seek = document.getElementById('edAudioSeek');
  const curEl = document.getElementById('edAudioCur');
  const durEl = document.getElementById('edAudioDur');
  audio.addEventListener('loadedmetadata', () => { durEl.textContent = fmtTime(audio.duration); });
  audio.addEventListener('timeupdate', () => {
    curEl.textContent = fmtTime(audio.currentTime);
    fill.style.width = (audio.duration ? (audio.currentTime/audio.duration*100) : 0) + '%';
  });
  audio.addEventListener('ended', () => { playBtn.textContent = '▶'; });
  playBtn.addEventListener('click', () => {
    if(audio.paused){ audio.play(); playBtn.textContent = '⏸'; }
    else{ audio.pause(); playBtn.textContent = '▶'; }
  });
  seek.addEventListener('click', (e) => {
    const rect = seek.getBoundingClientRect();
    const ratio = (e.clientX-rect.left)/rect.width;
    if(audio.duration) audio.currentTime = Math.min(1,Math.max(0,ratio))*audio.duration;
  });
}

let fontStyleCounter = 0;
async function openFontPreview(name, meta){
  const b64 = await fsOps.readFile(currentProject, currentPath, name);
  const ext = extOf(name);
  const fontMime = { ttf:'font/ttf', otf:'font/otf', woff:'font/woff', woff2:'font/woff2' }[ext] || 'font/ttf';
  const familyName = 'pvFont' + (fontStyleCounter++);
  const styleEl = document.createElement('style');
  styleEl.textContent = `@font-face{ font-family:'${familyName}'; src:url(data:${fontMime};base64,${b64}); }`;

      <div class="ed-pv-font-sample" style="font-family:'${familyName}';">abcdefghijklmnopqrstuvwxyz</div>

      <div class="ed-pv-info">

edImportInput.addEventListener('change', async () => {
  const file = edImportInput.files[0];
  edImportInput.value = '';
  if(!file) return;
  const isText = file.type.startsWith('text') || ['.js','.gd','.json','.txt','.md'].some(x => file.name.endsWith(x));
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      let data;
      if(isText){ data = reader.result; await fsOps.writeFile(currentProject, currentPath, file.name, data, 'utf8'); }
      else{ data = reader.result.split(',')[1]; await fsOps.writeFile(currentProject, currentPath, file.name, data); }
      await renderGrid();
      showToast('تم الاستيراد بنجاح');
    }catch(e){ console.error(e); showToast('تعذّر استيراد الملف'); }
  };
  if(isText) reader.readAsText(file); else reader.readAsDataURL(file);
});

/* --- تحريك حدود اللوحات --- */
function setupResizers(){
  const root = document.documentElement;
  function dragResizer(el, onMove){
    let dragging = false;
    const start = (e) => {
      dragging = true;
      el.classList.add('dragging');
      e.preventDefault();
    };
    const move = (e) => {
      if(!dragging) return;
      const point = e.touches ? e.touches[0] : e;
      onMove(point);
    };
    const end = () => { dragging = false; el.classList.remove('dragging'); };
    el.addEventListener('mousedown', start);
    el.addEventListener('touchstart', start, { passive:false });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive:false });
    window.addEventListener('mouseup', end);
    window.addEventListener('touchend', end);
  }

  dragResizer(document.getElementById('rzHierScene'), (p) => {
    const rect = edGrid.getBoundingClientRect();
    const w = Math.max(120, Math.min(rect.width * 0.5, p.clientX - rect.left));
    root.style.setProperty('--ed-col1', w + 'px');
  });
  dragResizer(document.getElementById('rzSceneInsp'), (p) => {
    const rect = edGrid.getBoundingClientRect();
    const w = Math.max(140, Math.min(rect.width * 0.5, rect.right - p.clientX));
    root.style.setProperty('--ed-col5', w + 'px');
  });
  dragResizer(document.getElementById('rzTopBottom'), (p) => {
    const rect = edGrid.getBoundingClientRect();
    const h = Math.max(90, Math.min(rect.height * 0.7, rect.bottom - p.clientY));
    root.style.setProperty('--ed-row3', h + 'px');
  });
}

(async function start(){
  await initStorage();
  await refresh();
  setupResizers();
})();
